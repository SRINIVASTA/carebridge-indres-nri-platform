[project]
name = "carebridge-nri-platform"
version = "0.1.0"
description = "NRI Parent Care & Concierge Platform built with Streamlit, SQLite3, and ReportLab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "T A Srinivas" }
]
dependencies = [
    "streamlit>=1.38.0",
    "pydantic>=2.8.0",
    "pandas>=2.2.0",
    "plotly>=5.23.0",
    "requests>=2.32.0",
    "stripe>=10.10.0",
    "razorpay>=1.4.2",
    "twilio>=9.3.0",
    "boto3>=1.35.0",
    "reportlab>=4.2.2",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "local_vault",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
